name: CI / deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest -q --cov=app --cov-report=term --cov-fail-under=85
      - name: Dependency audit
        run: pip-audit -r requirements.txt --strict

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-backend:
    # Pushes backend/ to the Hugging Face Space only after every check passes on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-hf
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Sync backend/ to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE: rachitkumar2105/SupportGPT-Backend
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "HF_TOKEN secret is not set"; exit 1; fi
          git config --global user.email "ci@users.noreply.github.com"
          git config --global user.name "SupportGPT CI"
          git clone --depth 1 "https://rachitkumar2105:${HF_TOKEN}@huggingface.co/spaces/${SPACE}" space
          rsync -a --checksum --delete --exclude .git --exclude .gitattributes --exclude tests --exclude '.env*' --exclude '*.db' \
            --exclude __pycache__ --exclude .pytest_cache --exclude .ruff_cache backend/ space/
          cd space
          git add -A
          if git diff --cached --quiet; then echo "Space already up to date"; exit 0; fi
          git commit -m "Deploy ${GITHUB_SHA::7} from GitHub"
          git push origin HEAD:main
